name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: bin/*.apk

      - name: Send APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F document=@"$APK_PATH" \
               -F caption="✅ **APK faylingiz muvaffaqiyatli tayyorlandi!**" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
